# Dev profile: H2 in-memory database with H2GIS spatial support
# Usage: mvn spring-boot:run "-Dspring-boot.run.jvmArguments=-Dspring.profiles.active=dev"

spring:
  datasource:
    url: jdbc:h2:mem:bhumisetu;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
