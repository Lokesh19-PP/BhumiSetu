version: '3.8'

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: bhumisetu-db
    environment:
      POSTGRES_DB: bhumisetu
      POSTGRES_USER: bhumisetu
      POSTGRES_PASSWORD: bhumisetu_pwd
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhumisetu -d bhumisetu"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bhumisetu-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bhumisetu-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgis:5432/bhumisetu
      SPRING_DATASOURCE_USERNAME: bhumisetu
      SPRING_DATASOURCE_PASSWORD: bhumisetu_pwd
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      APP_UPLOAD_DIR: /app/uploads
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgis:
        condition: service_healthy
    networks:
      - bhumisetu-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bhumisetu-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
      - "5173:80"
    depends_on:
      - backend
    networks:
      - bhumisetu-network

networks:
  bhumisetu-network:
    driver: bridge

volumes:
  postgis_data:
  backend_uploads:
